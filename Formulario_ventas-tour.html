<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ventas - Playa del Carmen</title>
    <style>
        :root {
            --primary-green: #A8E6CF; 
            --soft-coral: #FFB7B2;    
            --warm-yellow: #FFDAC1;   
            --text-dark: #3D3D3D;
            --white: #ffffff;
            --bg-light: #F4F9F4;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Contenedor para alinear ambos cuadros */
        .main-wrapper {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            align-items: flex-start;
        }

        .form-card, .converter-card {
            background-color: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.07);
        }

        .form-card {
            flex: 2; /* Más ancho */
            border-top: 10px solid var(--primary-green);
        }

        .converter-card {
            flex: 1; /* Más angosto */
            border-top: 10px solid var(--warm-yellow);
            position: sticky;
            top: 20px;
        }

        h2, h3 {
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width { grid-column: span 2; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #666;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #EAEAEA;
            border-radius: 10px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
            background-color: #FAFAFA;
        }

        input:focus, select:focus {
            border-color: var(--primary-green);
            background-color: #fff;
        }

        /* Estilos Calculadora */
        .converter-group {
            margin-bottom: 15px;
        }
        
        .result-box {
            background-color: var(--warm-yellow);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-top: 20px;
        }

        .status-box {
            grid-column: span 2;
            background-color: #fffaf7;
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed var(--soft-coral);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button {
            grid-column: span 2;
            background-color: var(--soft-coral);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            background-color: #ff9e97;
            transform: translateY(-2px);
        }

        /* Responsivo */
        @media (max-width: 900px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .form-card, .converter-card {
                width: 100%;
                max-width: 600px;
            }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="form-card">
        <h2>🌸 Registro de Venta</h2>
        <form id="ventaForm" class="form-grid">
            <div class="form-group">
                <label for="vendedorInput">Vendedor</label>
                <input type="text" id="vendedorInput" required placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label for="clienteInput">Nombre del Cliente</label>
                <input type="text" id="clienteInput" required placeholder="Nombre del turista">
            </div>

            <div class="form-group full-width">
                <label for="emailInput">Mail del Cliente</label>
                <input type="email" id="emailInput" required placeholder="cliente@correo.com">
            </div>

            <div class="form-group">
                <label for="tourInput">Tour</label>
                <select id="tourInput" required>
                    <option value="" disabled selected>Selecciona tour...</option>
                    <option value="Xcaret Plus">Xcaret Plus</option>
                    <option value="Chichen Itza">Chichén Itzá</option>
                    <option value="Tulum Coba">Tulum & Cobá</option>
                    <option value="Cenotes Playa">Ruta de Cenotes</option>
                    <option value="Catamaran">Catamarán Isla Mujeres</option>
                    <option value="Cozumel Snorkel">Cozumel Snorkel</option>
                </select>
            </div>

            <div class="form-group">
                <label for="provedorInput">Proveedor</label>
                <input type="text" id="provedorInput" required placeholder="Ej: Experiencias Maya">
            </div>

            <div class="form-group">
                <label for="cuponInput">Cupón</label>
                <input type="text" id="cuponInput" placeholder="CÓDIGO o N/A">
            </div>

            <div class="form-group">
                <label for="montoInput">Monto Pagado</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" id="montoInput" step="0.01" required placeholder="0.00">
                    <select id="monedaInput" style="width: 80px;">
                        <option value="USD">USD</option>
                        <option value="MXN">MXN</option>
                    </select>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="statusInput">Status</label>
                <select id="statusInput" onchange="toggleMontoAbonar()">
                    <option value="pagado">✅ Pagado</option>
                    <option value="reservado">⏳ Reservado</option>
                </select>
            </div>

            <div id="boxAbonar" class="status-box">
                <label for="montoAbonarInput" style="color: #e08c87;">Monto a Abonar</label>
                <input type="number" id="montoAbonarInput" step="0.01" placeholder="¿Cuánto falta pagar?">
            </div>

            <button type="submit" id="btnSubmit">Finalizar Registro</button>
        </form>
    </div>

    <div class="converter-card">
        <h3>💰 Conversor</h3>
        
        <div class="converter-group">
            <label>Divisa Extranjera</label>
            <select id="calcMoneda" onchange="convertir()">
                <option value="USD">Dólar Americano (USD)</option>
                <option value="CAD">Dólar Canadiense (CAD)</option>
            </select>
        </div>

        <div class="converter-group">
            <label>Monto</label>
            <input type="number" id="calcMonto" placeholder="Ej: 100" oninput="convertir()">
        </div>

        <div class="converter-group">
            <label>Tipo de Cambio</label>
            <input type="number" id="calcTipoCambio" step="0.01" value="17.50" oninput="convertir()">
            <small style="font-size: 0.7rem; color: #888;">* Ajusta según el día</small>
        </div>

        <div class="result-box" id="calcResultado">
            0.00 MXN
        </div>
        <p style="font-size: 0.75rem; text-align: center; color: #999; margin-top: 10px;">
            Presiona el monto para copiarlo al formulario
        </p>
    </div>
</div>

<script>
    // --- LÓGICA DE LA CALCULADORA ---
    function convertir() {
        const monto = document.getElementById('calcMonto').value;
        const tipoCambio = document.getElementById('calcTipoCambio').value;
        const resultadoDiv = document.getElementById('calcResultado');
        
        if (monto && tipoCambio) {
            const total = (monto * tipoCambio).toFixed(2);
            resultadoDiv.innerText = total + ' MXN';
        } else {
            resultadoDiv.innerText = '0.00 MXN';
        }
    }

    // --- LÓGICA DEL FORMULARIO ---
    const URL_WEBHOOK = 'http://localhost:5678/webhook-test/Formulario_ventas1';

    function toggleMontoAbonar() {
        const status = document.getElementById('statusInput').value;
        const box = document.getElementById('boxAbonar');
        const input = document.getElementById('montoAbonarInput');
        
        if (status === 'reservado') {
            box.style.display = 'block';
            input.required = true;
        } else {
            box.style.display = 'none';
            input.required = false;
            input.value = '';
        }
    }

    document.getElementById('ventaForm').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = 'Enviando...';

        const datosParaDB = {
            Vendedor: document.getElementById('vendedorInput').value,
            Nombre_Cliente: document.getElementById('clienteInput').value,
            cupon: document.getElementById('cuponInput').value || "N/A",
            tour: document.getElementById('tourInput').value,
            provedor: document.getElementById('provedorInput').value,
            monto: document.getElementById('montoInput').value,
            email_cliente: document.getElementById('emailInput').value,
            moneda: document.getElementById('monedaInput').value,
            status: document.getElementById('statusInput').value,
            monto_pendiente: document.getElementById('montoAbonarInput').value || 0,
            fecha: new Date().toISOString()
        };

        try {
            const response = await fetch(URL_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datosParaDB)
            });

            if (response.ok) {
                alert('¡Venta de ' + datosParaDB.Nombre_Cliente + ' registrada con éxito! 🌸');
                this.reset();
                toggleMontoAbonar();
            } else {
                alert('Error en el servidor. Revisa n8n.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de conexión. Verifica que el webhook esté activo.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Finalizar Registro';
        }
    };
</script>

</body>
</html>
